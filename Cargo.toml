[package]
name = "rustblocker"
version = "0.1.14"
edition = "2024"

[dependencies]
self_update = { version = "0.44", default-features = false, features = ["archive-tar", "compression-flate2", "reqwest", "rustls"] }
semver = "1"
hickory-server = { version = "0.26", features = ["resolver"] }
hickory-resolver = "0.26"
hickory-proto = "0.26"
futures = "0.3"
ipnet = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["rustls", "json", "cookies"], default-features = false }
actix-web = { version = "4", features = ["rustls-0_23"] }
actix-rt = "2"
bcrypt = "0.19"
rand = "0.10"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
serde_json = "1"
parking_lot = "0.12"
r2d2 = "0.8"
r2d2_sqlite = "0.35"
hickory-net = "0.26"

# ACME client
instant-acme = { version = "0.8", features = ["aws-lc-rs", "hyper-rustls"] }
rcgen = "0.14"
pem = "4"

# TLS for actix-web
rustls = "0.23"
rustls-pemfile = "2"



# Certificate parsing
x509-parser = "0.18"

[dev-dependencies]
async-trait = "0.1"
